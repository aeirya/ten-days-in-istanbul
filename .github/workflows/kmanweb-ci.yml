name: KMANWeb CI

# This repository is public, so never run untrusted pull-request code on a
# self-hosted runner. Manual dispatch is intentionally restricted to users with
# write access to the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmanweb-ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, kmanweb, docker, ten-days-in-istanbul]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Verify KMANWeb runner
        run: |
          set -Eeuo pipefail
          printf 'runner=%s\n' "$RUNNER_NAME"
          docker version >/dev/null

      - name: Validate static site
        run: |
          set -Eeuo pipefail
          test -s index.html
          test -s app.js
          test -s styles.css
          test -s basics.css
          python3 -m json.tool config/missions.json >/dev/null
          python3 -m json.tool config/basics.json >/dev/null
          printf 'kmanweb-ci-ok\n'
