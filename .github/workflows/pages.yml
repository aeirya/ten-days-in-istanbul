name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate static site
        run: |
          set -Eeuo pipefail
          test -s index.html
          test -s app.js
          test -s styles.css
          python3 -m json.tool config/missions.json >/dev/null

      - name: Stage site
        run: |
          set -Eeuo pipefail
          mkdir -p _site/config
          cp index.html app.js styles.css .nojekyll _site/
          cp config/missions.json _site/config/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
